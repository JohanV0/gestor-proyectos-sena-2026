<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gestor de Proyectos · Bienvenida</title>
  <!-- Tailwind CSS v3 (solo utilidades) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome 6 (iconos minimales) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
</head>
<body class="min-h-screen bg-slate-900 flex items-center justify-center p-4 antialiased">

  <!-- Tarjeta de bienvenida · solo clases Tailwind, sin CSS adicional -->
  <div class="w-full max-w-2xl bg-slate-800/80 backdrop-blur-sm rounded-3xl shadow-2xl shadow-indigo-900/40 border border-slate-700/60 p-8 sm:p-12 transition-all duration-300 hover:shadow-indigo-800/30">

    <!-- Icono + título -->
    <div class="flex items-center gap-4 mb-5">
      <div class="bg-indigo-900/50 text-indigo-300 w-14 h-14 rounded-2xl flex items-center justify-center shadow-inner shadow-indigo-900/30 border border-indigo-800/40">
        <i class="fas fa-tasks text-3xl"></i>
      </div>
      <h1 class="text-4xl sm:text-5xl font-extrabold tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-indigo-300 to-violet-300">
        Gestor de Proyectos
      </h1>
    </div>

    <!-- Mensaje principal de bienvenida -->
    <div class="space-y-5">
      <p class="text-2xl sm:text-3xl font-medium text-slate-100 flex items-center gap-3">
        <i class="fas fa-hand-wave text-indigo-400 text-3xl"></i>
        ¡Bienvenido!
      </p>
      
      <p class="text-base sm:text-lg text-slate-300 leading-relaxed max-w-xl">
        Organiza, prioriza y da seguimiento a tus proyectos desde un solo lugar. 
        <span class="font-medium text-indigo-300">Comienza ahora</span> y mantén el control de cada etapa.
      </p>

      <!-- Línea divisoria suave -->
      <div class="w-20 h-1 bg-gradient-to-r from-indigo-500/60 to-violet-500/60 rounded-full my-4"></div>

      <!-- Datos rápidos (solo para dar calidez, sin funcionalidad) -->
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 pt-2">
        <div class="flex items-center gap-3 text-slate-200 bg-slate-700/40 rounded-xl px-4 py-3 border border-slate-600/50 shadow-sm">
          <i class="fas fa-rocket text-indigo-400 text-lg"></i>
          <span class="text-sm font-medium">Inicia tu primer proyecto</span>
        </div>
        <div class="flex items-center gap-3 text-slate-200 bg-slate-700/40 rounded-xl px-4 py-3 border border-slate-600/50 shadow-sm">
          <i class="fas fa-users text-indigo-400 text-lg"></i>
          <span class="text-sm font-medium">Colabora en equipo</span>
        </div>
        <div class="flex items-center gap-3 text-slate-200 bg-slate-700/40 rounded-xl px-4 py-3 border border-slate-600/50 shadow-sm">
          <i class="fas fa-chart-line text-indigo-400 text-lg"></i>
          <span class="text-sm font-medium">Mide tu progreso</span>
        </div>
      </div>

      <!-- CTA sutil (solo bienvenida) -->
      <div class="mt-6 flex flex-wrap items-center justify-between gap-4 pt-2 border-t border-slate-700/60">
        <span class="text-sm text-slate-400 flex items-center gap-2">
          <i class="fas fa-check-circle text-emerald-400/80"></i>
          Listo para empezar
        </span>
        <span class="inline-flex items-center gap-2 text-indigo-300 font-medium bg-indigo-900/30 px-5 py-2 rounded-full border border-indigo-700/40 shadow-sm text-sm backdrop-blur-sm">
          <i class="fas fa-arrow-right"></i>
          Accede al panel
        </span>
      </div>
    </div>

    <!-- Pie de página decorativo (solo estético) -->
    <div class="mt-8 text-xs text-slate-500/70 flex items-center gap-2 justify-center border-t border-slate-700/40 pt-5">
      <i class="fas fa-moon"></i>
      <span>Tailwind · modo oscuro</span>
      <span class="w-1 h-1 rounded-full bg-slate-600/50"></span>
      <span>v3</span>
    </div>
  </div>

</body>
</html>
